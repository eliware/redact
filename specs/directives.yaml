version: "15.0"
description: Repository-specific public contract and behavior for @eliware/redact.
directives:
  - id: E-101.0
    dos:
      - Maintain a native ESM redaction and serialization library for Node.js 26 or
        later.
      - Export only functions listed in src/index.mjs and src/index.d.ts.
      - State the limits of redaction. Do not promise full secret detection.
    donts:
      - Do not expose internal implementation modules as public API without an
        intentional compatibility decision.
      - Do not claim that the package encrypts, stores, or controls access to secrets.
    children:
      - id: E-101.0.0
        dos:
          - Keep each source module in src/ and its matching test in the same tests/
            path.
          - Give each module one purpose and one change trigger.
          - Keep src/index.mjs as the public export list.
        donts:
          - Do not add a production module without its matching focused test.
          - Do not combine unrelated implementation responsibilities in a module or
            duplicate module-level assertions in higher-level tests.
      - id: E-101.0.1
        dos:
          - Use Node.js 26 and native ESM.
          - Preserve exports, behavior, markers, and declaration compatibility under
            SemVer.
          - Make breaking API changes only in a major release. Add migration guidance.
        donts:
          - Do not add CommonJS entrypoints or imply compatibility that is not declared
            and tested.
      - id: E-101.0.2
        dos:
          - Redact sensitive HTTP header values. Keep safe names and values.
          - Match header names without regard to uppercase or lowercase. Keep supported input forms.
          - Keep duplicate names in pair arrays. For iterable headers, redact each value
            before lowercase conversion.
          - Return an empty array if reading a Headers-like iterable fails.
          - Return an empty array for malformed pairs.
        donts:
          - Do not alter safe header values.
      - id: E-101.0.3
        dos:
          - Limit traversal depth, object keys, array items, string length, and text
            output.
          - Convert maxDepth, maxKeys, and maxArray to nonnegative integers. Floor
            finite fractions. Use defaults for non-finite values.
          - Limit retained property reads with maxKeys. Use key-only lookahead. The
            runtime can list every own key.
          - Keep the truncation marker outside the maxKeys count.
          - Keep truncation markers distinct from redaction markers.
          - Append `[TRUNCATED]` when maxArray omits array items.
          - Keep retained `__truncated` properties. Select a new suffixed marker key
            when needed.
        donts:
          - Do not rely on output limits to provide confidentiality.
      - id: E-101.0.4
        dos:
          - Exclude HTML, SQL, path cleanup, input checks, encryption, secret storage,
            scanning, access control, and sanitizers.
        donts:
          - Do not describe out-of-scope behavior as a function of @eliware/redact.
      - id: E-101.0.5
        dos:
          - Focus policy on sensitive structured keys and supported text patterns.
          - Use conservative defaults, case-insensitive matching, caller options, and
            non-mutating changes.
          - Expose policy keys as frozen ReadonlySet values without mutation methods.
        donts:
          - Do not use broad default matching that creates unacceptable false positives
            or mutates caller-owned values.
      - id: E-101.0.6
        dos:
          - Describe redaction as an observability support. Do not promise detection of
            unknown secrets.
          - Redact values before sending them to logs, storage, transport, or browsers.
        donts:
          - Do not claim complete detection of unknown secrets or rely on redaction as the
            only safeguard.
      - id: E-101.0.7
        dos:
          - Return bounded safe values for Errors, functions, symbols, BigInts, buffers,
            cycles, and failed properties.
          - Keep serialization limits separate from secrecy rules.
          - Serialize enumerable string keys. Omit enumerable symbol keys.
          - Read no more than maxKeys values. Use key-only lookahead for omitted keys.
          - Use the finite default for non-finite maxDepth.
          - Count Error name, message, and stack in maxKeys with custom properties. Read
            each field once.
          - If a retained property read fails, return an empty object.
          - Keep own `__proto__` data without changing the output prototype.
          - Apply sensitive-key policy to Error name, message, and stack.
        donts:
          - Do not use serialized output as proof that data is safe to disclose.
      - id: E-101.0.8
        dos:
          - Copy structured values recursively. Replace sensitive values with a stable
            marker.
          - Limit depth, object keys, and array items. Mark omitted output with
            `[TRUNCATED]`.
          - Use the finite default for non-finite maxDepth.
          - Keep retained input data when selecting an object marker. Use a new suffix
            if needed.
          - Support nested values, Errors, cycles, accessors, and hostile objects.
          - Visit own array indices and enumerable non-index properties. Keep sparse
            holes.
          - Match array index names as decimal property names.
          - Apply sensitive-key rules to enumerable non-index array properties.
          - Redact sensitive array properties with markers without reading values or counting them
            against maxKeys.
          - Mark omitted array values or properties with `[TRUNCATED]`.
          - If a retained array read fails, return an empty array.
          - If a retained object read fails, return an empty object.
          - Keep own `__proto__` data without changing the output prototype.
          - Apply sensitive-key policy to Error name, message, and stack.
        donts:
          - Do not mutate input values while redacting them.
      - id: E-101.0.9
        dos:
          - Document best-effort text redaction for authorization, bearer values,
            assignments, query secrets, provider tokens, JWTs, keys, and configured
            secrets.
          - Apply configured keys to matching text assignments and query values.
          - Merge overlapping literal-secret matches. Do not expose covered secret
            fragments.
          - Limit redactText output with a configurable maximum and truncation marker.
          - Bound input text before applying redaction rules.
          - Document supported patterns and limits. Help callers select more policy.
        donts:
          - Do not claim that text redaction detects arbitrary unknown secrets.
